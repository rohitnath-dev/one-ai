name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Create environment file
        shell: bash
        env:
          ONE_ENV: ${{ secrets.ONE_ENV }}
        run: |
          printf "%s\n" "$ONE_ENV" > .env

      - name: Build ONE
        run: |
          pyinstaller --clean --onefile --add-data ".env;." --name ONE main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ONE-Windows
          path: dist/ONE.exe
